# Render Blueprint: build must compile TypeScript so dist/server.js exists
services:
  - type: web
    name: audioly-backend
    env: node
    buildCommand: npm install && npm run build
    # Run from repo root so dist/server.js is found (works if Render's Root Directory is empty or set to backend)
    startCommand: sh -c 'if [ -f dist/server.js ]; then node dist/server.js; else cd .. && node dist/server.js; fi'
